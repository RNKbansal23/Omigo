<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1f35" />
      <stop offset="100%" stop-color="#150e1b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a623" />
      <stop offset="100%" stop-color="#ffd073" />
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3b2c" />
      <stop offset="100%" stop-color="#2c1e16" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg-grad)" />
  
  <!-- Ambient Glow -->
  <circle cx="300" cy="300" r="150" fill="#f5a623" opacity="0.15" filter="url(#glow)" />

  <!-- The Box -->
  <rect x="180" y="240" width="240" height="120" rx="10" fill="url(#box-grad)" stroke="url(#gold)" stroke-width="3" />
  <path d="M180,270 L420,270" stroke="url(#gold)" stroke-width="2" opacity="0.5" />
  
  <!-- Chocolates inside -->
  <circle cx="220" cy="285" r="15" fill="#3a2518" />
  <circle cx="260" cy="285" r="15" fill="#5c3a21" />
  <circle cx="300" cy="285" r="15" fill="#8c5a31" />
  <circle cx="340" cy="285" r="15" fill="#3a2518" />
  <circle cx="380" cy="285" r="15" fill="#5c3a21" />

  <circle cx="220" cy="325" r="15" fill="#5c3a21" />
  <circle cx="260" cy="325" r="15" fill="#8c5a31" />
  <circle cx="300" cy="325" r="15" fill="#3a2518" />
  <circle cx="340" cy="325" r="15" fill="#5c3a21" />
  <circle cx="380" cy="325" r="15" fill="#8c5a31" />

  <!-- Ribbon -->
  <rect x="285" y="240" width="30" height="120" fill="url(#gold)" opacity="0.9" />
  <path d="M260,220 C280,200 300,240 300,240 C300,240 320,200 340,220 C350,230 310,250 300,250 C290,250 250,230 260,220 Z" fill="url(#gold)" />
</svg>
